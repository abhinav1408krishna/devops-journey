services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-5000}:5000"
    environment:
      APP_ENV: production
    volumes:
      - app-data:/app/data
    networks:
      - docker-lab-network
    restart: unless-stopped

volumes:
  app-data:

networks:
  docker-lab-network:
    driver: bridge
