
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: devops-lab
  labels:
    app: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      automountServiceAccountToken: false
      containers:
        - name: flask-app
          image: docker-containerization-lab-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: flask-app-config
          env:
            - name: APP_DEMO_SECRET
              valueFrom:
                secretKeyRef:
                  name: flask-app-secret
                  key: APP_DEMO_SECRET

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
