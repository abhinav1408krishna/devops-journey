apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: devops-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer-role
  namespace: devops-lab
rules:
  - apiGroups: [""]
    resources:
      - services
      - configmaps
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources:
      - pods/portforward
    verbs: ["create"]

  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer-binding
  namespace: devops-lab
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: devops-lab
roleRef:
  kind: Role
  name: jenkins-deployer-role
  apiGroup: rbac.authorization.k8s.io
